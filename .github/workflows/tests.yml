name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch and the rest
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pytest

      - name: Run the suite
        run: pytest -q

      - name: Smoke-test the CLI end to end
        run: |
          python -m visionlab.cli data --size 32 --train-n 128 --val-n 64 --test-n 64 --out ""
          python -m visionlab.cli train --size 32 --train-n 256 --val-n 64 --test-n 64 \
            --epochs 2 --model tiny --width 8 --out ""
